# Castrol worker: needrestart must not restart the container runtime, or any
# castrol unit, underneath a running cycle.
#
# Install as /etc/needrestart/conf.d/castrol.conf. needrestart reads every
# file in conf.d as Perl, after its own needrestart.conf.
#
# Why this is needed even with docker.io blacklisted in unattended-upgrades:
# needrestart runs after EVERY apt transaction, and Ubuntu 24.04 runs it in
# automatic mode when nobody is at a terminal. It restarts any service that
# still maps an old copy of a library that was just upgraded. dockerd links
# libc and libsystemd, so a routine libc6, openssl or systemd security update
# restarts docker.service without any docker package being touched. Both
# castrol units declare Requires=docker.service, so the restart takes the
# running cycle down with it.
#
# A value of 0 means "do not restart this automatically". A person running
# `sudo needrestart` by hand between cycles still gets offered them.

$nrconf{override_rc}{qr(^docker\.service$)} = 0;
$nrconf{override_rc}{qr(^docker\.socket$)} = 0;
$nrconf{override_rc}{qr(^containerd\.service$)} = 0;
# The docker CLI in a castrol unit maps libc too. Restarting the unit is a
# stop of the cycle, whatever the reason.
$nrconf{override_rc}{qr(^castrol)} = 0;
