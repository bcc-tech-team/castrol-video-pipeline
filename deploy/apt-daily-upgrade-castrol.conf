# Castrol worker: run unattended upgrades in the one window no timer cycle
# can be in.
#
# Install as /etc/systemd/system/apt-daily-upgrade.timer.d/castrol.conf, then
# `sudo systemctl daemon-reload`.
#
# The cycles start at 00:00 and 12:00 IST and stop themselves at an 8h
# deadline, with the unit's 9h TimeoutStartSec behind that. So a timer cycle
# can be running at any time except 09:00-12:00 IST. 10:30 with a 30 minute
# spread lands inside that window with margin at both ends.
#
# This is the SECOND line of defence. The blacklist and the needrestart
# override are what stop docker restarting under a cycle. A by-hand
# `castrol --bg cycle` or `castrol --bg run` can be running at any hour, and
# no timer setting protects that.

[Timer]
# An empty assignment clears the stock 06:00 (UTC on this box) before adding ours.
OnCalendar=
OnCalendar=*-*-* 10:30:00 Asia/Kolkata
RandomizedDelaySec=30min
# The stock timer catches up a missed run at boot. At boot the castrol timer
# starts its resume cycle (OnBootSec=5min), so a catch-up there would land
# the upgrade right on top of it.
Persistent=false
